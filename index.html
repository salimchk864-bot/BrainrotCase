<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brainrot Case</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🧠 Brainrot Case</h1>
    <div class="stats">
      <span>💰 Монети: <b id="coins">100</b></span>
      <span>🎒 Колекція: <b id="count">0</b></span>
    </div>
  </header>

  <main>
    <section class="case">
      <h2>Відкрий кейс</h2>
      <p>Натисни кнопку та спробуй отримати випадковий Brainrot.</p>
      <button id="openBtn">Відкрити кейс — 10 💰</button>
      <div id="result" class="result">Тут з'явиться результат</div>
    </section>

    <section>
      <h2>🎒 Твоя колекція</h2>
      <div id="collection" class="collection"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
