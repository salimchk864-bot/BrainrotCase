/* ---------- мины ---------- */

/* ================= v24: новый дизайн (по макету BidBrainer) ================= */
:root{--bg:#150e1d;--card:#20172b;--card2:#291e37;--line:#3a2c4d;--txt:#f4eaf8;--mut:#a897c0;--acc:#a78bda;--gold:#f5c518;--ok:#9fd45a;--bad:#ef5b6b;--or:#f5a742;--ink:#4a3568;--fd:"Lilita One","Trebuchet MS",system-ui,sans-serif}
html,body{background-color:var(--bg)}
body{font-family:Nunito,"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;
 background:radial-gradient(700px 420px at 6% -5%,rgba(74,42,154,.47),transparent),radial-gradient(600px 420px at 100% 10%,rgba(255,95,162,.2),transparent),#120d26}
body:before{opacity:.5}
h2,.sech,.ct,.win h3,.mh b,.wc b,.pfn,.ast b,.herob b,.tot b,.big,.tabs button,.qrow button{font-family:var(--fd);font-weight:400;letter-spacing:.3px}
h2{font-size:28px;line-height:1;margin:10px 0 16px;color:var(--txt)}

/* шапка */
header{background:#1a1224;border-bottom:1px solid var(--line);-webkit-backdrop-filter:none;backdrop-filter:none;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px}
.logo{display:flex;align-items:center;gap:8px;background:none;-webkit-background-clip:border-box;background-clip:border-box;-webkit-text-fill-color:initial;color:#fff;font-family:var(--fd);font-weight:400;font-size:25px;line-height:1;letter-spacing:.2px}
.logo .lav{width:30px;height:30px;border-radius:9px;object-fit:cover;box-shadow:0 0 0 2px var(--ink)}
.logo span{font-style:normal;color:#fff;-webkit-text-fill-color:#fff;background:none;white-space:nowrap}
.logo span em{font-style:normal;color:var(--or);-webkit-text-fill-color:var(--or)}
.bal{background:#251a33;border:1px solid #4a3568;border-radius:14px;padding:5px 5px 5px 12px;font-family:var(--fd);font-size:19px;gap:8px}
.bal b{color:#fff;font-weight:400}
.plus{width:30px;height:30px;border-radius:10px;background:#a78bda;color:#fff;font-family:var(--fd);font-size:20px;box-shadow:0 2px 0 #6f55a8}
.plus:active{transform:translateY(2px);box-shadow:none}
.strm,.snd{width:38px;height:38px;border-radius:12px;background:#251a33;border:1px solid #4a3568}
.strm.on{background:#4a3568;border-color:#a78bda}

/* нижняя панель */
nav{background:#1a1224;border-top:1px solid var(--line);-webkit-backdrop-filter:none;backdrop-filter:none;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:4px}
nav button{border-radius:16px;padding:8px 0 6px;color:var(--mut);transition:background .2s,color .2s,transform .15s}
nav button span{font-family:Nunito,system-ui,sans-serif;font-size:11px;font-weight:800}
nav button.on{background:#a78bda;color:#fff;transform:none;box-shadow:0 4px 14px rgba(167,139,218,.35)}
nav button.on span{color:#fff}
nav button.on:after{display:none}

/* заголовки секций с пунктирной линией */
.sech{display:flex;align-items:center;gap:12px;font-size:24px;color:var(--txt);margin:22px 2px 12px;text-align:left}
.sech:after{content:"";flex:1;border-top:2px dotted #4a3568;opacity:.8}

/* карточки кейсов */
.case{background:linear-gradient(180deg,#24192f,#1b1325);border:1px solid var(--line);border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 6px 18px rgba(0,0,0,.28)}
.case:hover{border-color:var(--acc)}
.ct{font-size:16px;color:var(--txt);text-transform:uppercase;letter-spacing:1px}
.cf{border-top:1px solid var(--line);color:var(--mut)}
.cf b{color:var(--txt);font-family:var(--fd);font-weight:400;font-size:16px}
.cf .cn{background:var(--gold);color:#3a2b00}
.cf .fr{color:var(--ok)}

/* hero-блок */
.herob{background:linear-gradient(160deg,#241a32,#1b1325);border:1px dashed rgba(245,197,24,.55);border-radius:18px}
.herob b{color:var(--gold);font-size:20px}
.herob span{color:var(--mut)}

/* панели и окна */
.panel,.mbox{background:linear-gradient(180deg,#24192f,#1c1326);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#modal{background:rgba(14,8,22,.82)}
.mh b{font-size:20px}
.xb{background:#291e37;border:1px solid var(--line);border-radius:12px}

/* кнопки */
.big{background:linear-gradient(180deg,#b79bea,#a78bda);color:#fff;border:0;border-radius:14px;box-shadow:0 4px 0 #6f55a8,0 8px 18px rgba(167,139,218,.25);text-shadow:0 1px 0 rgba(0,0,0,.18)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #6f55a8}
.big.ok{background:linear-gradient(180deg,#b6e46f,#9fd45a);color:#1e3200;box-shadow:0 4px 0 #6d9a2c,0 8px 18px rgba(159,212,90,.22);text-shadow:none}
.big.gh{background:#291e37;color:var(--txt);border:1px solid var(--line);box-shadow:none;text-shadow:none}
.big.red{background:linear-gradient(180deg,#f57c89,#ef5b6b);color:#fff;box-shadow:0 4px 0 #b53a49}
.tabs button.on,.qrow button.on,.cnt{background:#a78bda;color:#fff;border-color:#a78bda}

/* поля ввода */
input.q,input.f,select.q,textarea{background:#1a1224;border:1px solid var(--line);border-radius:12px;color:var(--txt);font-family:Nunito,system-ui,sans-serif;font-weight:800}
input.q:focus,input.f:focus,textarea.q:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(167,139,218,.2)}
input.pin{border:2px dashed var(--gold);background:#2a1f3a;color:var(--gold);font-family:var(--fd);letter-spacing:3px}

/* предметы */
.it{background:linear-gradient(180deg,#291e37,#20172b);border-radius:14px}
.it.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),0 0 16px rgba(167,139,218,.35)}
.it .p{color:var(--gold)}
.feed{border-radius:16px}
.fd,.fd.top{background:#24192f;border-color:var(--line)}

/* профиль и прочее */
.pfh,.pfs,.pfbest,.pfh2,.pfpart,.ach .ab,.ab,.dpw .dc,.req,.selrow,.tot,.astats .ast,.bcard{border-color:var(--line)}
.tot{background:#2a1f3a;border:1px dashed #4a3568;border-radius:12px}
.tot b{color:var(--gold)}
.pfn{font-size:22px}
#toast{background:#291e37;border:1px solid var(--acc);border-radius:14px;color:var(--txt)}
.sw.on{background:#a78bda}
::selection{background:rgba(167,139,218,.4)}

/* ===== v26: Aurora Glass — обновлённый атмосферный фон ===== */
html{background:#0b0818!important;min-height:100%;isolation:isolate}
body{
 position:relative;z-index:1;min-height:100vh;background:transparent!important;
 font-family:Nunito,"Trebuchet MS",system-ui,sans-serif
}
html:before{
 content:"";position:fixed;inset:-18%;z-index:0;pointer-events:none;
 background:
  radial-gradient(ellipse 42% 38% at 12% 12%,rgba(123,76,255,.48),transparent 72%),
  radial-gradient(ellipse 38% 34% at 88% 18%,rgba(255,76,165,.30),transparent 72%),
  radial-gradient(ellipse 46% 40% at 72% 88%,rgba(35,155,255,.27),transparent 72%),
  radial-gradient(ellipse 30% 28% at 18% 82%,rgba(245,197,24,.13),transparent 72%),
  radial-gradient(ellipse 55% 45% at 50% 48%,rgba(91,52,150,.19),transparent 75%),
  linear-gradient(145deg,#100a20 0%,#17102b 48%,#0b1022 100%);
 background-size:120% 120%;animation:auroraFlow 24s ease-in-out infinite alternate;
 will-change:transform
}
html:after{
 content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.48;
 background-image:
  radial-gradient(1.5px 1.5px at 8% 17%,rgba(255,255,255,.9),transparent 70%),
  radial-gradient(1px 1px at 28% 66%,rgba(213,194,255,.85),transparent 70%),
  radial-gradient(1.6px 1.6px at 74% 26%,rgba(255,220,245,.8),transparent 70%),
  radial-gradient(1px 1px at 91% 76%,rgba(255,255,255,.8),transparent 70%),
  radial-gradient(1.2px 1.2px at 52% 42%,rgba(155,203,255,.8),transparent 70%);
 background-size:230px 240px,290px 310px,330px 280px,260px 300px,370px 350px;
 animation:starShimmer 6s ease-in-out infinite alternate
}
@keyframes auroraFlow{
 0%{transform:translate3d(-1.5%,-1%,0) rotate(-2deg) scale(1)}
 50%{transform:translate3d(2%,1.5%,0) rotate(2deg) scale(1.06)}
 100%{transform:translate3d(-1%,2%,0) rotate(-1deg) scale(1.03)}
}
@keyframes starShimmer{from{opacity:.25}to{opacity:.65}}
/* Полупрозрачные поверхности, чтобы новый фон красиво просвечивал */
header,nav{
 background:rgba(20,13,35,.82)!important;
 -webkit-backdrop-filter:blur(18px) saturate(145%);
 backdrop-filter:blur(18px) saturate(145%);
 border-color:rgba(190,157,255,.19)!important
}
.panel,.mbox{
 background:linear-gradient(145deg,rgba(43,30,66,.91),rgba(22,15,39,.94))!important;
 border-color:rgba(190,157,255,.22)!important;
 box-shadow:0 14px 38px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.055)
}
.case,.it{
 background:linear-gradient(145deg,rgba(48,34,70,.92),rgba(25,17,43,.94))!important;
 border-color:rgba(190,157,255,.18)
}
.herob{
 background:linear-gradient(135deg,rgba(91,62,137,.35),rgba(27,18,47,.88))!important;
 border-color:rgba(210,185,255,.42)

@keyframes admlive{0%{box-shadow:0 0 0 0 rgba(20,184,106,.6)}70%{box-shadow:0 0 0 7px rgba(20,184,106,0)}100%{box-shadow:0 0 0 0 rgba(20,184,106,0)}}
.astats{grid-template-columns:repeat(2,1fr)!important}
.ast{border-top-width:6px!important}
.ast:nth-child(1){border-top-color:var(--yel)!important}.ast:nth-child(2){border-top-color:#b79bea!important}.ast:nth-child(3){border-top-color:#5fb0ff!important}.ast:nth-child(4){border-top-color:var(--acc)!important}
.ast:nth-child(5){border-top-color:var(--ok)!important}.ast:nth-child(6){border-top-color:var(--ok)!important}.ast:nth-child(7){border-top-color:#5fb0ff!important}.ast:nth-child(8){border-top-color:var(--gold)!important}
#atabs{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;gap:6px!important;padding:6px 2px 12px!important;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#atabs::-webkit-scrollbar{display:none}
#atabs button{flex:0 0 auto!important;flex-direction:row!important;white-space:nowrap!important;padding:9px 13px!important;font-size:13px!important;border-radius:999px!important;scroll-snap-align:center}
.atg{flex:0 0 auto!important;grid-column:auto!important;align-self:center;margin:0 2px 0 10px!important;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.1);font-size:10px!important;white-space:nowrap}
.atg:first-child{margin-left:0!important}.atg:after{display:none!important}
#aq{height:46px;border-radius:14px!important;font-size:15px}
.ahelp{font-size:12px!important;line-height:1.45;padding:9px 12px!important}
.ahelp b:first-child{color:var(--yel)}
#admb .req{padding:14px 14px 12px!important;border-left-width:8px!important}
#admb .req .arow{padding-bottom:8px!important;margin-bottom:8px;border-bottom:2px dotted rgba(246,239,220,.25)!important}
#admb .req:has(.bd.new){border-left-color:var(--yel)!important}
#admb .req:has(.bd.contacted){border-left-color:#b79bea!important}
#admb .req:has(.bd.done){border-left-color:var(--ok)!important}
#admb .req:has(.bd.rejected){border-left-color:var(--bad)!important}
#admb .req:has(.bd.cancelled){border-left-color:#8a84a8!important;opacity:.88}
.bd{font-size:11px!important;padding:4px 10px!important}
.bd.cancelled{background:#4a4570!important;color:#fff!important}
#admb .req .row{gap:8px;margin-top:10px;flex-wrap:wrap}
#admb .req .row>.big{flex:1 1 120px}
#admb .req .row>.big.red{flex:0 0 46px}
.item-chip{background:var(--bg)!important;border:2px solid var(--line);border-radius:10px!important;padding:4px 9px!important;font-weight:800}
.chips .chip{padding:8px 13px}

function beep(f,d,v,type){if(MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=v||.05;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.05));o.stop(AC.currentTime+(d||.05))}catch(e){}}

const FX={p:[],on:false};
function confetti(rgb,n,x,y){const cv=$('fx');cv.width=window.innerWidth||document.documentElement.clientWidth;cv.height=window.innerHeight||document.documentElement.clientHeight;const cols=[`rgb(${rgb})`,'#ffc83d','#fff','#2261f1'];
  for(let i=0;i<(n||140);i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*10;FX.p.push({x:x||innerWidth/2,y:y||innerHeight*.4,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:3+Math.random()*5,c:cols[i%4],l:1,rot:Math.random()*6})}
  if(!FX.on){FX.on=true;requestAnimationFrame(fxLoop)}}
function fxLoop(){const cv=$('fx'),c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);FX.p=FX.p.filter(p=>p.l>0);
  for(const p of FX.p){p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.vx*=.99;p.l-=.012;p.rot+=.2;c.globalAlpha=Math.max(0,p.l);c.fillStyle=p.c;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillRect(-p.r,-p.r/2,p.r*2,p.r);c.restore()}
  if(FX.p.length)requestAnimationFrame(fxLoop);else{FX.on=false;c.clearRect(0,0,cv.width,cv.height)}}

function qb(k){const i=$('cbet');if(!i)return;const v=+i.value||1;i.value=k?Math.max(1,Math.floor(v*k)):Math.max(1,S.bal)}

  if(CR.st==='run'){b.className='big ok';b.textContent=`💰 Забрать ${fmt(Math.floor(CR.bet*mAt(crT())))} 🪙`;$('cs').textContent='Ракета летит…'}

async function crStart(){
  const bet=Math.floor(+$('cbet').value),a=parseFloat($('cauto').value)||null;if(!(bet>=1))return toast('Введи ставку');
  try{const r=await api('/api/crash/start',{bet,auto:a,fast:CFAST});S=wrap(r.state);updHead();CR.bet=bet;CR.auto=a;CR.parts=[];CR.res=null;crBegin(r.round);beep(300,.2,.06,'sawtooth')}catch(e){toast(e.message)}}
function crBegin(rd){CR.g=rd.g||0.25;CR.st='run';CR.bet=rd.bet;CR.base=rd.t;CR.t0=performance.now();clearInterval(CR.poll);CR.poll=setInterval(crPoll,CR.g>0.3?80:140);cancelAnimationFrame(CR.raf);CR.raf=requestAnimationFrame(crLoop);crSync()}
async function crPoll(){if(CR.st!=='run')return;try{const j=await api('/api/crash/poll');if(!j.round)return;if(j.round.status==='run'){CR.base=j.round.t;CR.t0=performance.now()}else crEnd(j.round,j.state)}catch(e){}}
async function crCash(){if(CR.st!=='run')return;try{const r=await api('/api/crash/cashout',{});crEnd(r.round,r.state)}catch(e){toast(e.message)}}
function crEnd(rd,state){if(CR.st!=='run')return;CR.st='end';clearInterval(CR.poll);CR.res=rd;CR.m=rd.status==='cashed'?rd.m:rd.crash;if(state)S=wrap(state);
  if(rd.crash!=null){CR.hist.push(rd.crash);CR.hist=CR.hist.slice(-14)}updHead();crHist();
  if(rd.status==='cashed'){jingle(3);confetti('53,208,127',110,innerWidth/2,innerHeight*.35);toast('💰 +'+fmt(rd.payout)+' 🪙 (x'+rd.m.toFixed(2)+')')}
  else{beep(90,.6,.1,'sawtooth');crBoom();document.body.classList.add('shakeall');setTimeout(()=>document.body.classList.remove('shakeall'),450)}
  const b=$('cbtn');if(b){b.disabled=true;b.className='big gh'}
  cancelAnimationFrame(CR.raf);CR.raf=requestAnimationFrame(crLoop);
  setTimeout(()=>{CR.st='idle';CR.res=null;CR.m=1;crSync();const cm=$('cm');if(cm){cm.textContent='1.00x';cm.style.color=''}const cs=$('cs');if(cs)cs.textContent='Сделай ставку';crDraw()},2200)}
function crBoom(){const cv=$('cv');if(!cv)return;const p=crPos(cv,CR.m);for(let i=0;i<70;i++){const a=Math.random()*6.28,s=1+Math.random()*7;CR.parts.push({x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1})}}
function crPos(cv,m){const W=cv.width,H=cv.height,d=devicePixelRatio||1,t=Math.max(Math.log(m)/G(),.001),tmax=Math.max(0.8/G(),t*1.12),mmax=Math.max(2,m*1.25);
  return{x:20*d+(t/tmax)*(W-60*d),y:H-24*d-((m-1)/(mmax-1))*(H-70*d),tmax,mmax,t,W,H,d}}
function crLoop(){const cv=$('cv');if(!cv){if(CR.st==='run')CR.raf=requestAnimationFrame(crLoop);return}crDraw();if(CR.st==='run'||CR.parts.length||CR.st==='end')CR.raf=requestAnimationFrame(crLoop)}
function crDraw(){
  const cv=$('cv');if(!cv)return;const c=cv.getContext('2d'),W=cv.width,H=cv.height,d=devicePixelRatio||1;c.clearRect(0,0,W,H);
  const run=CR.st==='run',crashed=CR.res&&CR.res.status==='crashed',cashed=CR.res&&CR.res.status==='cashed';
  const m=run?Math.exp(G()*crT()):(CR.res?CR.m:1),shown=Math.floor(m*100)/100;
  const P=crPos(cv,Math.max(1,m));
  c.strokeStyle='rgba(255,255,255,.05)';c.lineWidth=1;for(let i=1;i<6;i++){c.beginPath();c.moveTo(0,H*i/6);c.lineTo(W,H*i/6);c.stroke()}
  const col=crashed?'#ff4d6a':(m<2?'#35d07f':m<5?'#ffc83d':'#ff9a3d');
  if(run||CR.res){const N=60;c.beginPath();c.moveTo(20*d,H-24*d);
    for(let i=0;i<=N;i++){const t=P.t*i/N,mm=Math.exp(G()*t),x=20*d+(t/P.tmax)*(W-60*d),y=H-24*d-((mm-1)/(P.mmax-1))*(H-70*d);c.lineTo(x,y)}
    c.strokeStyle=col;c.lineWidth=4*d;c.shadowColor=col;c.shadowBlur=18*d;c.stroke();c.shadowBlur=0;
    c.lineTo(P.x,H-24*d);c.closePath();const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');c.fillStyle=g;c.fill();
    if(run||cashed){c.save();c.translate(P.x,P.y);c.rotate(-0.6);c.font=`${30*d}px serif`;c.textAlign='center';c.textBaseline='middle';
      for(let i=0;i<6;i++){c.globalAlpha=.55-i*.09;c.fillStyle=i%2?'#ff9a3d':'#ffc83d';c.beginPath();c.arc(-18*d-i*9*d+Math.random()*4*d,10*d+Math.random()*4*d,(9-i)*d,0,6.28);c.fill()}c.globalAlpha=1;c.fillText('🚀',0,0);c.restore()}}
  CR.parts=CR.parts.filter(p=>p.l>0);for(const p of CR.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l-=.02;c.globalAlpha=Math.max(0,p.l);c.fillStyle=p.l>.5?'#ffc83d':'#ff4d6a';c.beginPath();c.arc(p.x,p.y,(2+p.l*4)*d,0,6.28);c.fill()}c.globalAlpha=1;
  const cm=$('cm'),cs=$('cs');if(cm){cm.textContent=(crashed?CR.m:shown).toFixed(2)+'x';cm.style.color=crashed?'#ff4d6a':col}
  if(cs&&!run&&CR.res)cs.textContent=crashed?'💥 КРАШ! Ставка сгорела':'✅ Забрано +'+fmt(CR.res.payout)+' 🪙';
  if(run)crSync()}

function mnDraw(){const b=$('mnb');if(!b)return;

async function cePhotoUpload(input){
  const file=input.files&&input.files[0]; if(!file)return;
  if(!file.type.startsWith('image/')){input.value='';return toast('Выбери файл изображения');}
  try{
    const img=await new Promise((resolve,reject)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);resolve(im)};im.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('Не удалось открыть изображение'))};im.src=u});
    const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    const data=canvas.toDataURL('image/webp',0.86);
    if(data.length>2.8*1024*1024)return toast('Изображение слишком большое. Выбери другое.');
    await api('/api/admin/case/photo',{key:CE.e.key,data});
    const key=CE.e.key;toast('Фото кейса обновлено ✅');await caseReload();await loadAdmin(true);ceOpen(key);
  }catch(err){toast(err.message||'Ошибка загрузки изображения')}finally{input.value=''}

}

    if(last<v.length)f.appendChild(document.createTextNode(v.slice(last)));
    p.replaceChild(f,t)}
  function scan(n){
    if(n.nodeType===3){fix(n);return}
    if(n.nodeType!==1||/^(SCRIPT|STYLE|SVG|CANVAS|TEXTAREA|SELECT)$/i.test(n.tagName))return;
    var w=document.createTreeWalker(n,4),a=[],x;while((x=w.nextNode()))a.push(x);a.forEach(fix)}
  var mo=new MutationObserver(function(ms){
    mo.disconnect();
    try{ms.forEach(function(m){if(m.type==='characterData')scan(m.target);else for(var i=0;i<m.addedNodes.length;i++)scan(m.addedNodes[i])})}catch(e){}
    mo.observe(document.body,{childList:true,subtree:true,characterData:true})});
  try{scan(document.body)}catch(e){}
  mo.observe(document.body,{childList:true,subtree:true,characterData:true});
})();

  /* --- поля ввода: надёжный фокус, Enter закрывает клавиатуру, прокрутка к полю --- */
  var TXT='input:not([type=checkbox]):not([type=range]):not([type=radio]):not([type=button]),textarea';
  document.addEventListener('touchend',function(e){var t=e.target;
    if(t&&t.matches&&t.matches(TXT)&&document.activeElement!==t){setTimeout(function(){try{if(document.activeElement!==t)t.focus()}catch(_){}},0)}},{passive:true});

    if(t&&t.matches&&t.matches(TXT)&&t.closest&&t.closest('#modal')){setTimeout(function(){try{t.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}},350)}});

  /* --- промокод при пополнении: заглавные + применяется сам --- */

  const m=Math.floor(secs/60),s=String(secs%60).padStart(2,'0');
  e.className='abz';e.innerHTML=`<div class="abt"><b>🎉 ${esc(ev.title)}</b><span>Награда: <b>${esc(ev.prize)}</b> · осталось ${ev.left} из ${ev.max} · ⏱ ${m}:${s}</span></div><button class="big ok sm2" onclick="abzClaim()">Забрать</button>`}
